name: Bug report
description: Something in AgentDE doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.2"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: AgentDE version and build
      description: AgentDE → About, or the status bar.
      placeholder: "e.g. 0.2.0 (134)"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: "`claude --version` or `codex --version`, if it's about an agent tab."
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Help → Open Debug Log; paste the lines around the problem. Check them for anything private first.
      render: text
